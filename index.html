<!doctype html>
<html lang="ko" data-theme="kawaii-synth-cassette">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘 — 민트 음표. SVG 를 먼저 쓰고, SVG 를 못 쓰는 브라우저는 ICO(16 · 32 · 48). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      YouTube 임베드가 Referer 헤더를 요구한다. 헤더가 없으면 오류 153 으로
      재생이 거부된다 (SYSTEM_DESIGN.md §8.1). 현대 브라우저의 기본값이 이
      값과 같지만, 기본값에 의존하면 기본값이 바뀌거나 더 엄격한 정책이 섞일 때
      원인을 찾기 어려운 재생 실패가 된다. 승인된 레퍼런스와 같은 값이다.
      no-referrer 로 바꾸면 재생이 깨진다 (M3-0.8).
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>39page</title>
    <script>
      /*
       * 저장된 테마를 첫 페인트 전에 적용한다. 측정 결과 모듈 스크립트는
       * first-paint 이후에 실행되어, 이 코드가 없으면 저장된 테마와 다른
       * 배경색이 한 프레임 보인다.
       *
       * 저장된 값이 없으면 위 <html data-theme> 의 기본 테마(M11-7B: kawaii-synth-cassette)가
       * 그대로 쓰인다. 저장된 값이 **알려진 두 키일 때만** 적용한다 — 알 수 없는 값을 그대로
       * 넣으면 CSS 의 바탕 토큰(mono-vinyl)이 한 프레임 보였다가 기본 테마로 바뀐다.
       * 키 목록은 src/shared/types/theme.ts 의 THEME_KEYS 와 같아야 한다 (시험이 지킨다).
       * 마운트 시 Theme Store 가 검증된 값으로 이 속성을 덮어쓴다 — 단일 진실 공급원은 Theme Store 다.
       *
       * 커스텀 테마(ADR 0045)면 사용자가 고른 다섯 색도 미리 건다 — 없거나 형식이 다르면 기본 색
       * (themes/custom/defaults.css). 강조색 위 글자색 계산 · 검증은 Custom Theme Store 가 곧 다시 한다.
       */
      try {
        var saved = JSON.parse(localStorage.getItem('39page.theme')).data
        if (saved === 'kawaii-synth-cassette' || saved === 'mono-vinyl' || saved === 'custom') {
          document.documentElement.dataset.theme = saved
        }
        if (saved === 'custom') {
          var colors = JSON.parse(localStorage.getItem('39page.customTheme')).data.colors
          var names = ['background', 'surface', 'text', 'accent', 'line']
          for (var i = 0; i < names.length; i += 1) {
            if (/^#[0-9a-f]{6}$/.test(colors[names[i]])) {
              document.documentElement.style.setProperty('--custom-' + names[i], colors[names[i]])
            }
          }
        }
      } catch (error) {
        /* 저장값이 없거나 손상됨 — 기본 테마를 그대로 쓴다 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
